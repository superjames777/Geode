name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build geode.exe
        run: |
          cmake -S . -B build
          cmake --build build --config Release
      - name: Create Release and upload executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "build\Release\geode.exe" `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
